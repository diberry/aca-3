name: Validation

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: validation-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
      - name: Enable pinned pnpm
        run: |
          corepack enable
          corepack prepare pnpm@12.7.0 --activate
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Validate foundation
        run: pnpm validate
      - name: Audit production dependencies
        run: pnpm audit --prod --audit-level high
      - name: Build Stage 0 containers
        run: |
          docker build -f src/auth/Containerfile -t aca-auth:stage-0 .
          docker build -f src/author/Containerfile -t aca-author:stage-0 .
          docker build -f src/backend/Containerfile -t aca-backend:stage-0 .
