name: Pull Request Policy

on:
  pull_request:
    types:
      - opened
      - synchronize
      - reopened
      - ready_for_review
      - edited

permissions:
  checks: read
  contents: read
  pull-requests: read

concurrency:
  group: pr-policy-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  pr-description:
    name: pr-description
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
      - name: Validate pull request description
        run: node scripts/check-pr-description.mjs --event "${GITHUB_EVENT_PATH}"

  tdd-policy:
    name: tdd-policy
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
      - name: Collect pull request evidence
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          gh api --paginate --slurp \
            "repos/${GITHUB_REPOSITORY}/pulls/${PR_NUMBER}/files?per_page=100" \
            > "${RUNNER_TEMP}/pr-files.json"
          gh api --paginate --slurp \
            "repos/${GITHUB_REPOSITORY}/pulls/${PR_NUMBER}/commits?per_page=100" \
            > "${RUNNER_TEMP}/pr-commits.json"
      - name: Enforce TDD evidence
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          node scripts/check-tdd-policy.mjs \
            --event "${GITHUB_EVENT_PATH}" \
            --files "${RUNNER_TEMP}/pr-files.json" \
            --commits "${RUNNER_TEMP}/pr-commits.json" \
            --exemptions ".github/governance/tdd-exemptions.json" \
            --repository "${GITHUB_REPOSITORY}"
